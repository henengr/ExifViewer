name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os-name }} - Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os-name: ubuntu-latest
            build-type: cmake
          - os: windows-latest
            os-name: windows-latest-cmake
            build-type: cmake
          - os: windows-latest
            os-name: windows-latest-vs2022
            build-type: msbuild
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # for Linux
    - name: Setup Environment (linux only)
      if: matrix.build-type == 'cmake' && matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libgtest-dev googletest
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
    
    # for Windows (CMake + vcpkg)
    - name: Setup Environment (Windows CMake)
      if: matrix.build-type == 'cmake' && matrix.os == 'windows-latest'
      run: |
        vcpkg install gtest:x64-windows

    # for VisualStudio (MSBuild)
    - name: Setup MSBuild
      if: matrix.build-type == 'msbuild'
      uses: microsoft/setup-msbuild@v2

    # for Visual Studio (NuGetパッケージの復元：必要な場合のみ)
    # もしソリューションでNuGet管理の依存関係（GTest等）があれば有効にしてください
    #- name: Restore NuGet Packages
    #  if: matrix.build-type == 'msbuild'
    #  run: nuget restore YourSolution.sln

    # CMake configuration
    - name: Configure CMake
      if: matrix.build-type == 'cmake'
      run: |
        if ("${{ matrix.os }}" -eq "windows-latest") {
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        } else {
          cmake -B build -DCMAKE_BUILD_TYPE=Release
        }
      shell: pwsh
    
    # execute build
    - name: Build (CMake)
      if: matrix.build-type == 'cmake'
      run: cmake --build build --config Release
    
    # execute build (VisualStudio / MSBuild)
    - name: Build (VisualStudio)
      if: matrix.build-type == 'msbuild'
      run: msbuild ExifViewer.sln /p:Configuration=Release /p:Platform=x64

    # GoogleTest automatic execute
    - name: Run Tests (CMake)
      if: matrix.build-type == 'cmake'
      working-directory: build
      run: ctest -C Release --output-on-failure

    # GoogleTest automatic execute (for VisualStudio environment)
    # ※MSBuildでビルドされたテスト実行バイナリを直接叩く例です。パスは構成に合わせて調整してください。
    #- name: Run Tests (Visual Studio)
    #  if: matrix.build-type == 'msbuild'
    #  run: .\x64\Release\YourTestProject.exe
