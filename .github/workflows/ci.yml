name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # for Linux
    - name: Setup Environment (linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libgtest-dev googletest
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV]
    
    # for Windows
    - name: Setup Environment (Windows only)
      if: matrix.os == 'windows-latest'
      run: |
        vcpkg install gtest:x64-windows

    # CMake configuration
    - name: Configure CMake
      run: |
        if ("${{ matrix.os }}" -eq "windows-latest") {
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        } else {
          cmake -B build -DCMAKE_BUILD_TYPE=Release
        }
      shell: pwsh
    
    # execute build
    - name: Build
      run: cmake --build build --config Release
    
    # GoogleTest automatic execute
    - name: Run Tests
      working-directory: build
      run: ctest -C Release --output-on-failure

